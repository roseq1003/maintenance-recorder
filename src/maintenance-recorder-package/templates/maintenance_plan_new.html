{% extends 'base.html' %}
{% from '_fields.html' import plan_fields, form_actions %}
{% block title %}メンテナンス項目を追加{% endblock %}
{% block content %}
<a class="back-link" href="/devices/{{ device.id }}">← 機器詳細へ戻る</a>
<div class="page-heading"><h1>メンテナンス項目を追加</h1></div>
<p class="muted">対象機器：{{ device.name }}</p>
<section class="panel"><form method="post" action="/devices/{{ device.id }}/maintenance/new">{{ plan_fields() }}{{ form_actions('項目を追加', '/devices/' ~ device.id) }}</form></section>
{% endblock %}

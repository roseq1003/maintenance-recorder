<!--
    このファイルが「HTML5」で書かれていることを
    ブラウザに伝える宣言。
-->
<!DOCTYPE html>


<!--
    HTML文書全体の開始。

    lang="ja"
    → このページの主な言語は日本語ですよ、という指定。
-->
<html lang="ja">


<!--
    head
    -------------------------
    Webページそのものの設定を書く場所。

    基本的に、ここに書いた内容は
    ページ本文としては表示されない。
-->
<head>

    <!--
        文字コードをUTF-8に指定。

        日本語の文字化けを防ぐためにも
        基本的に入れておけばOK。
    -->
    <meta charset="UTF-8">


    <!--
        スマートフォンなどで表示したときの
        ページ幅を調整するための設定。

        width=device-width
        → 画面幅を端末の幅に合わせる

        initial-scale=1.0
        → 最初の表示倍率を100%にする
    -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!--
        ブラウザのタブに表示されるタイトル。
    -->
    <title>機器メンテナンス管理君 1.0</title>


    <!--
        外部CSSファイルを読み込む。

        href="style.css"
        → このHTMLファイルと同じ場所にある
          style.css を読み込む。

        CSSは主に
        ・色
        ・文字サイズ
        ・配置
        ・余白
        ・枠線
        などの見た目を担当する。
    -->
    <link rel="stylesheet" href="/static/style.css">

</head>


<!--
    body
    -------------------------
    実際にブラウザ画面へ表示される内容。
-->
<body>


    <!--
        header
        -------------------------
        ページ上部のヘッダー部分。

        今回はページタイトルを表示している。
    -->
    <header>

        <!--
            h1 = 最も重要な見出し。

            基本的にはページのメインタイトルとして使用。
        -->
        <h1>🔧 機器メンテナンス管理</h1>

    </header>


    <!--
        nav
        -------------------------
        navigation（ナビゲーション）。

        ページ移動用のメニューなどを
        まとめるために使用する。
    -->
    <nav>

        <!--
            button = ボタン。

            現時点では押しても何も起きない。

            今後、
            ・リンク
            ・JavaScript
            などを設定することで動作させる。
        -->
        <button>メイン</button>

        <button>登録機器一覧</button>

        <button>機器登録</button>

    </nav>


    <!--
        main
        -------------------------
        このページの主要コンテンツ。

        headerやnavとは違い、
        「このページでユーザーに見せたい中心部分」
        を入れる。
    -->
    <main>


        <!--
            section
            -------------------------
            ページ内のひとまとまりの内容。

            class="summary"
            → このsectionに「summary」という名前を付けている。

            この名前をCSSなどから利用できる。
        -->
        <section class="summary">


            <!--
                div
                -------------------------
                汎用的な「箱」。

                class="card"
                → この箱にcardという名前を付けている。

                CSSでカード風のデザインにするときなどに使用。
            -->
            <div class="card">

                <!-- 小見出し -->
                <h3>登録機器数</h3>

                <!-- 通常の文章 -->
                <p>{{ device_count }} 台</p>

            </div>


            <div class="card">

                <h3>今月のメンテナンス予定</h3>

                <p>3 件</p>

            </div>


            <div class="card">

                <h3>来月のメンテナンス予定</h3>

                <p>2 件</p>

            </div>


            <!--
                classには複数の名前を指定できる。

                この場合、

                card
                warning

                という2つのclassを持っている。

                例えばCSSで

                .card {
                    ...
                }

                .warning {
                    ...
                }

                の両方を適用できる。
            -->
            <div class="card warning">

                <h3>期限超過</h3>

                <p>1 件</p>

            </div>

        </section>



        <!--
            ここからメンテナンス予定一覧。

            panelというclassを付けている。
        -->
        <section class="panel">


            <!--
                h2 = h1より一段下の見出し。
            -->
            <h2>今月のメンテナンス予定</h2>


            <!--
                table
                -------------------------
                表を作るためのタグ。
            -->
            <table>


                <!--
                    thead
                    -------------------------
                    tableの「見出し部分」。
                -->
                <thead>


                    <!--
                        tr = Table Row

                        表の「1行」を表す。
                    -->
                    <tr>


                        <!--
                            th = Table Header

                            表の見出しセル。
                        -->
                        <th>実施予定日</th>

                        <th>機器名</th>

                        <th>メンテナンス項目</th>

                        <th>設置場所</th>

                        <th>重要度</th>

                    </tr>

                </thead>



                <!--
                    tbody
                    -------------------------
                    tableの実際のデータ部分。
                -->
                <tbody>

                    {% for item in maintenance_list %}

                    <tr>
                        <td>{{ item.date }}</td>
                        <td>{{ item.device }}</td>
                        <td>{{ item.task }}</td>
                        <td>{{ item.location }}</td>
                        <td>{{ item.priority }}</td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </section>

    </main>


    <!--
        JavaScriptファイルを読み込む。

        src="app.js"
        → 同じ場所にあるapp.jsを実行する。

        JavaScriptでは例えば、

        ・ボタンを押したときの処理
        ・画面の一部を書き換える
        ・APIへデータを送る

        といった処理ができる。

        現段階ではJavaScriptが必要なければ、
        この行はなくても問題ない。
    -->
    <script src="/static/app.js"></script>


</body>

</html>
